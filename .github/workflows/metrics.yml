name: GitHub Metrics

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/metrics.yml'

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to the stable lowlighter/metrics release for reproducible action code.
      - name: Generate profile metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: 7byteDev
          template: classic
          filename: github-metrics.svg
          base: header, activity, community, repositories
          repositories_affiliations: owner
          config_timezone: Europe/Istanbul
          config_display: large
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_indepth: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
